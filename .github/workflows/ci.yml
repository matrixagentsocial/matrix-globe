name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - run: python -m pytest -q
      - run: python bench/validate_tasks.py

  docker-sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - run: docker build -t matrix-globe-runner:py311 -f docker/Dockerfile docker/
      - run: python -m pytest -q tests/test_docker_live.py
        env:
          MATRIX_GLOBE_DOCKER: "1"
