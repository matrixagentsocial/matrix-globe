name: pages

on:
  push:
    branches: [main]
    paths: ["site/**", "results/**", "proof/bundle.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - run: python site/build_index.py --out site/data
      - name: Add the demo video from its release (not committed to git)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download demo-video-v1 -R "$GITHUB_REPOSITORY" -p matrix-globe-demo.mp4 -D site || echo "no demo video release"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
