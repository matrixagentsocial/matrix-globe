[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matrix-globe"
version = "0.1.0"
description = "Matrix Globe: AI-written code that ships with a receipt. No proof, no bug."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Oscar Santana" },
]
dependencies = [
    "openai",
    "pydantic>=2",
    "httpx",
    "pytest",
    "python-dotenv",
    # IANA tz database for zoneinfo: Windows and slim images ship none.
    "tzdata",
]

[tool.setuptools.packages.find]
include = ["proof*", "bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
